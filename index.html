<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Job-Boy 3000</title>

<link rel="stylesheet"
href="assets/css/style.css">

<link rel="stylesheet"
href="assets/css/theme.css">

<link rel="stylesheet"
href="assets/css/jobboy.css">

</head>

<body>

<div class="jobboy">

    <div class="jobboy-header">

        <div class="stats-left">

            <div class="mini-stat">
                COM <span id="stat-communication">0</span>
            </div>

            <div class="mini-stat">
                TEAM <span id="stat-teamwork">0</span>
            </div>

            <div class="mini-stat">
                LEAD <span id="stat-leadership">0</span>
            </div>

        </div>

        <div class="jobboy-center">

            <div class="speaker"></div>

            <h1 class="jobboy-title">
                JOB-BOY 3000
            </h1>

            <div class="subtitle">
                Vault-Tec Career Services
            </div>

        </div>

        <div class="stats-right">

            <div class="mini-stat">
                ORG <span id="stat-organization">0</span>
            </div>

            <div class="mini-stat">
                PROF <span id="stat-professionalism">0</span>
            </div>

            <div class="mini-stat">
                LEARN <span id="stat-learning">0</span>
            </div>

            <div class="mini-stat">
                ADAPT <span id="stat-adaptability">0</span>
            </div>

        </div>

    </div>

    <!-- SCREEN -->

    <div class="jobboy-screen">

        <iframe
            id="jobboyFrame"
            src="indexhome.html">
        </iframe>

    </div>

    <!-- KNOB -->

    <div class="twist-container">

        <div
            class="twist-knob"
            id="twistKnob">
        </div>

    </div>

    <!--PROGRESS-->
    <div class="progress-display">

        <div class="progress-label">

            TRAINING

        </div>

        <div class="progress-bar">

            <div
            id="progress-fill"
            class="progress-fill">
            </div>

        </div>

        <div id="case-progress">

            0%

        </div>

    </div>
    <!-- BUTTONS -->

    <div class="controls">

        <button id="prevBtn">
            ◄ Prev
        </button>

        <button id="homeBtn">
            ⌂ Home
        </button>

        <button id="nextBtn">
            Next ►
        </button>

    </div>

</div>


 <script src="assets/js/sounds.js"></script>
<script src="assets/js/jobboy.js"></script>

</body>

</html>
